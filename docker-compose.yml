version: '3.9'

services:
  db:
    image: postgres:16-alpine
    container_name: vml_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vml_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vml_pass}
      POSTGRES_DB: ${POSTGRES_DB:-vml_db}
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-vml_user}']
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: vml_api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-vml_user}:${POSTGRES_PASSWORD:-vml_pass}@db:5432/${POSTGRES_DB:-vml_db}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-supersecretaccesskey}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-supersecretrefreshkey}
      NODE_ENV: production
      PORT: 4000
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
    ports:
      - '4000:4000'
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:4000/api/health || exit 1']
      interval: 30s
      timeout: 10s
      retries: 3

  web:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:4000}
    container_name: vml_web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - '5173:80'

volumes:
  pgdata:
